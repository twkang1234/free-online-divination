a{color:inherit;text-decoration:none}a:hover{text-decoration:none}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.wrap{width:min(1170px,calc(100% - 36px));margin:auto}.topbar{background:rgba(8,9,18,.86);backdrop-filter:blur(18px);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}.topinner{min-height:71px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;letter-spacing:.07em}.brandmark{display:grid;place-items:center;width:37px;height:37px;border:1px solid rgba(191,172,255,.35);border-radius:11px;color:#d9c6ff;background:rgba(151,114,232,.11);font-size:1.35rem}.nav{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.nav a{font-size:.8rem;padding:8px 12px;color:var(--sub);border:1px solid var(--line);border-radius:11px}.nav a:hover{color:#fff;border-color:#9885dc}.nav a.featured{background:linear-gradient(125deg,#c7b5ff,#9cb0e0);color:#1d1634;font-weight:800;border-color:transparent}
.hero{padding:58px 0 33px;display:flex;justify-content:space-between;align-items:center;gap:30px}.eyebrow{font-size:.73rem;font-weight:850;letter-spacing:.18em;color:#9edbd7}.hero h1{font-size:clamp(2.1rem,4.3vw,3.6rem);line-height:1.25;margin:12px 0 16px;letter-spacing:-.04em}.hero p{color:var(--sub);max-width:760px;margin:0;font-size:.93rem}.hero-symbol{width:145px;height:145px;flex:none;border-radius:32px;display:grid;place-items:center;font-size:4.2rem;color:#cab7ff;background:radial-gradient(circle at 30% 20%,rgba(176,144,243,.19),transparent 70%),var(--panel);border:1px solid var(--line);box-shadow:0 16px 55px rgba(0,0,0,.25)}
.info{border-left:3px solid var(--mint);background:rgba(107,207,199,.06);padding:12px 16px;border-radius:10px;font-size:.81rem;color:var(--sub);margin:5px 0 25px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:0 0 24px}.stat{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:15px 18px}.stat strong{display:block;font-size:1.65rem;color:#f0e4c3;line-height:1.3}.stat small{font-size:.75rem;color:var(--dim)}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 20px}.filter{padding:9px 15px;border-radius:999px;background:rgba(24,27,46,.78);border:1px solid var(--line);color:var(--sub);font-size:.83rem;font-weight:700}.filter:hover{color:var(--text);border-color:#ab9ade}.filter[aria-pressed=true]{background:rgba(117,177,196,.13);color:#c8f2f3;border-color:#78bac4}.rowhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:22px 0 16px}.rowhead h2{margin:0;font-size:1.2rem}.rowhead small{color:var(--dim)}.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.review{min-width:0;border:1px solid rgba(175,168,224,.17);border-radius:20px;background:linear-gradient(155deg,#191b2e,#111422);padding:22px;display:flex;flex-direction:column;gap:11px;min-height:246px;box-shadow:0 12px 35px rgba(0,0,0,.12)}.review:hover{border-color:rgba(197,175,255,.43);transform:translateY(-2px);transition:.2s}.who{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:linear-gradient(130deg,rgba(182,160,249,.28),rgba(77,155,186,.1));border:1px solid rgba(188,169,248,.3);display:grid;place-items:center;font-weight:900;color:#eee2ff}.who-info{min-width:0;flex:1}.nick{font-weight:850;overflow-wrap:anywhere;font-size:.87rem}.tool-name{color:var(--dim);font-size:.75rem;line-height:1.4}.approved{font-size:.69rem;white-space:nowrap;color:#a9dfe9;border:1px solid rgba(128,213,225,.25);padding:2px 8px;border-radius:99px}.rating{font-size:1.24rem;letter-spacing:.08em;color:var(--gold);line-height:1.3}/* 心得沒有標題：維持卡片以星級、暱稱、分類與內文為主。 */.body{font-size:.88rem;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:#c8cadd;margin:0;flex:1}.bottom{margin-top:auto;padding-top:11px;border-top:1px solid rgba(235,232,255,.085);display:flex;justify-content:space-between;gap:12px;font-size:.72rem;color:var(--dim)}.bottom b{color:#bfb6db;font-weight:700}.empty{grid-column:1/-1;background:rgba(24,27,45,.54);border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--sub);padding:45px 20px}.empty strong{display:block;color:var(--text);margin-bottom:6px}.loadmore{text-align:center;margin:24px 0 50px}.btn{min-height:43px;padding:10px 19px;border-radius:11px;border:1px solid rgba(176,166,238,.32);background:#16192b;color:var(--text);font-weight:750}.btn:hover:not(:disabled){background:#222740;border-color:#baa9ff}.btn.primary{background:linear-gradient(125deg,#c9b9ff,#a7d7e0);color:#1a1833;border-color:transparent}.foot{padding:30px 0 55px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:.76rem;color:var(--dim)}.foot a{color:#cdc6e6}.hint{font-size:.77rem;color:var(--sub)}
@media(max-width:880px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-symbol{width:105px;height:105px;font-size:3rem}.stats{gap:9px}}
@media(max-width:620px){.wrap{width:calc(100% - 26px)}.topinner{min-height:65px;align-items:flex-start;padding:11px 0;flex-direction:column}.nav{gap:6px}.nav a{font-size:.74rem}.hero{padding:35px 0 23px}.hero-symbol{display:none}.hero h1{font-size:2.2rem}.wall{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:11px 13px}.review{min-height:0;padding:19px}.approved{font-size:.66rem}.rowhead{align-items:flex-start;flex-direction:column;gap:2px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.hero p{max-width:660px}
.privacy-note{font-size:.8rem;color:var(--dim);margin:0 0 23px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr));max-width:565px;gap:12px;margin-bottom:25px}
.stat{padding:13px 19px}.stat strong{font-size:1.7rem}.stat small{font-size:.78rem}

.review-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:21px 0 14px}
.review-actions h2{font-size:1.15rem;line-height:1.5;margin:0}
.review-actions .right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.sort-control{border:1px solid var(--line);border-radius:9px;background:#151828;color:var(--text);padding:7px 11px;font-size:.8rem;min-height:39px}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.wall-column{display:flex;flex-direction:column;gap:16px;min-width:0}
.review{width:100%;display:flex;vertical-align:top;break-inside:avoid;page-break-inside:avoid;margin-bottom:0;min-height:0;padding:19px 20px;gap:12px;box-shadow:0 9px 24px rgba(0,0,0,.10)}
.review:hover{transform:translateY(-2px);border-color:rgba(197,175,255,.43)}
.who{align-items:center;gap:9px}
.who-info{flex:1}
.avatar{width:36px;height:36px}
.stars{color:var(--gold);font-size:1.08rem;line-height:1.35;letter-spacing:.025em;white-space:nowrap}
.body{flex:auto;color:#d0d2e2;font-size:.89rem;line-height:1.85}
.empty{display:block;grid-column:1/-1}
.loadmore{margin:10px 0 40px}
.share-prompt{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0 46px;padding:21px 22px;background:linear-gradient(120deg,rgba(141,113,220,.11),rgba(105,197,188,.055));border:1px solid var(--line);border-radius:16px}
.share-prompt strong{font-size:1.04rem;color:var(--text)}
.share-prompt p{margin:2px 0 0;font-size:.83rem;color:var(--sub)}
.share-prompt .btn{white-space:nowrap}
@media(max-width:880px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.hero{padding-bottom:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));max-width:none}.wall{grid-template-columns:1fr}.review{padding:17px 18px}.review-actions{align-items:flex-start}.review-actions .right{width:100%;justify-content:space-between}.share-prompt{align-items:stretch}.share-prompt .btn{text-align:center}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topinner"><a class="brand" href="https://divinationhub.tw/"><span class="brandmark" aria-hidden="true">✺</span><span>一念知機</span></a><nav class="nav" aria-label="網站導覽"><a href="https://divinationhub.tw/">網站首頁</a><a href="member.html">會員中心</a><a class="featured" href="member.html?submitReview=1">發表使用心得 ↗</a></nav></div></header>
<main class="wrap">
<section class="hero"><div><div class="eyebrow">MEMBER REVIEWS · DIVINATION HUB</div><h1>會員心得展示牆</h1><p>看看大家使用八字排盤、塔羅占卜與易經占卜的心得，以及值得繼續改進的地方。</p></div><div class="hero-symbol" aria-hidden="true">✧</div></section>
<p class="privacy-note">公開心得使用會員自行設定的暱稱，不顯示個人帳號資料。</p>
<div class="stats" aria-label="心得展示統計"><div class="stat"><strong id="totalCount">—</strong><small>公開心得</small></div><div class="stat"><strong id="averageRating">—</strong><small>平均使用評分（滿分 5 星）</small></div></div>
<nav class="tools" id="filters" aria-label="依工具篩選心得"><button class="filter" data-tool="" aria-pressed="true">全部心得</button><button class="filter" data-tool="bazi" aria-pressed="false">八字排盤</button><button class="filter" data-tool="tarot" aria-pressed="false">塔羅占卜</button><button class="filter" data-tool="yijing" aria-pressed="false">易經占卜</button><button class="filter" data-tool="site" aria-pressed="false">整體網站體驗</button></nav>
<div class="review-actions"><h2>大家的使用心得</h2><div class="right"><small id="lastUpdate">正在載入心得……</small><label for="sortOrder" class="hint">排序 <select id="sortOrder" class="sort-control" aria-label="心得排序"><option value="newest">最新優先</option><option value="oldest">最早優先</option></select></label></div></div>
<div id="wall" class="wall" aria-live="polite"><div class="empty">正在讀取公開心得……</div></div>
<div class="loadmore"><button type="button" class="btn" id="loadMore" hidden>載入更多心得 ↓</button><button type="button" class="btn" id="retry" hidden>重新讀取</button></div>
<div class="share-prompt"><div><strong>看完大家的分享，也歡迎留下你的使用心得！</strong><p>每一則真實的使用感受與建議，都能幫助一念知機持續改進。</p></div><a class="btn primary" href="member.html?submitReview=1">分享我的心得 ↗</a></div>
</main>
<footer class="wrap foot"><span>© 一念知機 Divination Hub · 會員心得展示牆</span><span><a href="member.html">會員中心</a>　·　<a href="https://divinationhub.tw/">網站首頁</a></span></footer>
<script>
(()=>{'use strict';
  const API='https://member-api.ezgocpu.workers.dev/reviews/public';
  const PAGE_SIZE=12;
  const FETCH_SIZE=40;
  const MAX_ITEMS=5000; // 安全上限；一般資料量會完整取得，不虛構任何心得。
  const TOOL_NAMES={bazi:'八字排盤',tarot:'塔羅占卜',yijing:'易經占卜',site:'整體網站體驗'};
  const $=id=>document.getElementById(id);
  const make=(tag,cls,value)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=String(value);return el};
  const filters=[...document.querySelectorAll('[data-tool]')];
  let all=[],tool='',visibleCount=PAGE_SIZE,loadEpoch=0,loading=false,loaded=false,lastColumnCount=0;
  const query=new URLSearchParams(location.search).get('tool')||'';
  if(Object.prototype.hasOwnProperty.call(TOOL_NAMES,query))tool=query;

  function renderCard(r){
    const card=make('article','review');
    const nick=String(r.nickname||'匿名會員').trim().slice(0,36)||'匿名會員';
    const head=make('div','who');const info=make('div','who-info');
    info.append(make('div','nick',nick),make('div','tool-name',TOOL_NAMES[r.tool]||'網站工具'));
    const avatar=make('div','avatar',Array.from(nick)[0]||'會');avatar.setAttribute('aria-hidden','true');
    const score=Math.min(5,Math.max(1,Math.round(Number(r.rating)||1)));
    const rating=make('span','stars','★'.repeat(score)+'☆'.repeat(5-score));rating.setAttribute('aria-label','評分 '+score+'／5 星');
    head.append(avatar,info,rating);
    card.append(head,make('p','body',String(r.body||'').trim()));
    return card;
  }
  function sortTimestamp(r){
    const value=r.publishedAt||r.createdAt||r.updatedAt;
    if(!value)return NaN;
    if(typeof value==='number')return value>1e11?value:value*1000;
    const d=Date.parse(value);return Number.isFinite(d)?d:NaN;
  }
  function currentRows(){
    let rows=all.map((r,i)=>({r,i})).filter(x=>!tool||x.r.tool===tool);
    const oldest=$('sortOrder').value==='oldest';
    rows.sort((a,b)=>{
      const da=sortTimestamp(a.r),db=sortTimestamp(b.r);
      if(Number.isFinite(da)&&Number.isFinite(db)&&db!==da)return oldest?da-db:db-da;
      // 後端預設以最新在前；沒有日期欄位時保留此相對順序。
      return oldest?b.i-a.i:a.i-b.i;
    });
    return rows.map(x=>x.r);
  }
  function showEmpty(title,description){const root=make('div','empty');root.append(make('strong','',title),make('span','',description));$('wall').replaceChildren(root);}
  function updateFilters(){for(const b of filters)b.setAttribute('aria-pressed',String(b.dataset.tool===tool));}
  function updateStats(){
    $('totalCount').textContent=all.length.toLocaleString('zh-TW');
    const ratings=all.map(r=>Number(r.rating)).filter(n=>Number.isFinite(n)&&n>=1&&n<=5);
    $('averageRating').textContent=ratings.length?(ratings.reduce((sum,n)=>sum+n,0)/ratings.length).toFixed(1)+' ★':'—';
  }
  function render(){
    updateFilters();
    const rows=currentRows();
    const visible=rows.slice(0,visibleCount);
    if(!visible.length)showEmpty('目前沒有這個分類的心得','可以切換其他工具分類看看。');
    else{
      const count=matchMedia('(max-width:620px)').matches?1:matchMedia('(max-width:880px)').matches?2:3;
      lastColumnCount=count;
      const columns=Array.from({length:count},()=>make('div','wall-column'));
      // 最新心得由左至右排列；下一輪依序落入各欄，沒有長短不一的整列空白。
      visible.forEach((r,i)=>columns[i%count].append(renderCard(r)));
      $('wall').replaceChildren(...columns);
    }
    $('lastUpdate').textContent='已顯示 '+visible.length+'／'+rows.length+' 篇';
    $('loadMore').hidden=visible.length>=rows.length;
  }
  async function load(){
    const ticket=++loadEpoch;loading=true;loaded=false;all=[];
    $('retry').hidden=true;$('loadMore').hidden=true;$('totalCount').textContent='—';$('averageRating').textContent='—';
    $('lastUpdate').textContent='正在載入心得……';showEmpty('正在載入心得……','請稍候。');
    try{
      let offset=0,total=Infinity;
      const results=[],seen=new Set();
      for(let page=0;page<150&&offset<total&&offset<MAX_ITEMS;page++){
        const url=new URL(API);url.searchParams.set('limit',String(FETCH_SIZE));url.searchParams.set('offset',String(offset));
        const response=await fetch(url.toString(),{headers:{Accept:'application/json'},cache:'no-store'});
        const data=await response.json().catch(()=>({}));
        if(!response.ok||data.success===false||!Array.isArray(data.reviews))throw Error('無法取得心得資料');
        if(Number.isFinite(Number(data.total))&&data.total!==null&&data.total!==undefined)total=Math.max(0,Number(data.total));
        if(!data.reviews.length)break;
        for(const r of data.reviews){
          if(!r||!String(r.body||'').trim())continue;
          const key=String(r.id||[r.nickname,r.tool,r.rating,r.body].join('|'));
          if(seen.has(key))continue;
          seen.add(key);results.push(r);
        }
        offset+=data.reviews.length;
        if(ticket!==loadEpoch)return;
      }
      if(ticket!==loadEpoch)return;
      all=results;loaded=true;visibleCount=PAGE_SIZE;updateStats();render();
    }catch(error){if(ticket!==loadEpoch)return;
      showEmpty('目前無法載入心得','請稍後再試。');$('lastUpdate').textContent='讀取失敗';$('retry').hidden=false;
    }finally{if(ticket===loadEpoch)loading=false;}
  }
  filters.forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.tool===tool)return;tool=b.dataset.tool;visibleCount=PAGE_SIZE;
    if(loaded)render();else updateFilters();
    const next=new URL(location.href);if(tool)next.searchParams.set('tool',tool);else next.searchParams.delete('tool');
    if(location.protocol==='https:'||location.protocol==='http:')history.replaceState(null,'',next.pathname+next.search);
  }));
  $('sortOrder').addEventListener('change',()=>{visibleCount=PAGE_SIZE;if(loaded)render();});
  $('loadMore').addEventListener('click',()=>{visibleCount+=PAGE_SIZE;render();});
  $('retry').addEventListener('click',()=>{if(!loading)load();});
  updateFilters();load();
  window.addEventListener('resize',()=>{
    const count=matchMedia('(max-width:620px)').matches?1:matchMedia('(max-width:880px)').matches?2:3;
    if(loaded&&count!==lastColumnCount)render();
  },{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!loading&&!loaded)load();});
})();
</script>
