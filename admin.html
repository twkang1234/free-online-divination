<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會員管理｜DivinationHub</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#07090d;--panel:#0d1118;--line:#242a33;--text:#eee7da;--muted:#8290a2;--gold:#d9b65d}
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
.brand small{display:block;color:var(--gold);letter-spacing:.18em;font-size:.68rem;margin-bottom:6px}
.brand h1{margin:0;font-size:1.55rem}
.actions{display:flex;gap:8px;align-items:center}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{border:1px solid #242b35;background:#0b0f15;color:#9eabba;text-decoration:none;border-radius:9px;padding:8px 11px;font-size:.78rem}
.nav a:hover{border-color:#4a4130;color:#e2c574}
.btn{border:1px solid #3b3321;background:#17140d;color:#e3c778;border-radius:10px;padding:9px 13px;cursor:pointer}
.btn.secondary{border-color:#24313a;background:#0b1217;color:#a9cdd0}
.login-card{max-width:520px;margin:80px auto 0;background:var(--panel);border:1px solid #282e37;border-radius:18px;padding:26px;text-align:center}
.login-card h2{margin:0 0 8px}
.login-card p{margin:0 0 20px;color:var(--muted);line-height:1.7;font-size:.9rem}
.login-form{display:grid;gap:12px;max-width:360px;margin:0 auto}
.login-form input{width:100%;border:1px solid #2b323d;background:#090d13;color:#f1eadb;border-radius:10px;padding:12px 13px;font-size:1rem;outline:none}
.login-form input:focus{border-color:#7d6840;box-shadow:0 0 0 3px rgba(217,182,93,.08)}
.login-form .btn{width:100%;font-size:.92rem}
.dashboard[hidden],.login-card[hidden]{display:none!important}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.card span{display:block;color:var(--muted);font-size:.76rem;margin-bottom:9px}
.card strong{font-size:1.65rem;color:#f3e6bf}
.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.section-head{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.section-head h2{margin:0;font-size:1rem}
.section-head span{color:var(--muted);font-size:.74rem}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #1d232b;font-size:.78rem}
th{color:#9aa7b7;background:#0a0d12}
td{color:#d6dce3}
td.muted{color:var(--muted)}
.status{margin-top:12px;color:var(--muted);font-size:.78rem}
.error{color:#e09a9a}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><small>DIVINATIONHUB · ADMIN</small><h1>會員管理</h1></div>
    <div class="actions">
      <nav class="nav" aria-label="管理導覽">
        <a href="/">回首頁</a>
        <a href="/bazi.html">八字工具</a>
      </nav>
      <button class="btn secondary" id="refreshBtn" hidden>重新整理</button>
      <button class="btn" id="logoutBtn" hidden>登出</button>
    </div>
  </div>

  <section class="login-card" id="loginCard">
    <h2>管理員登入</h2>
    <p>請輸入管理員密碼。密碼只會送到 Cloudflare Worker 驗證，不會寫在這個網頁檔案裡。</p>
    <form class="login-form" id="loginForm">
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="管理員密碼" required>
      <button class="btn" id="loginBtn" type="submit">登入後台</button>
    </form>
    <div class="status" id="loginStatus"></div>
  </section>

  <main class="dashboard" id="dashboard" hidden>
    <div class="cards">
      <div class="card"><span>會員總數</span><strong id="totalMembers">—</strong></div>
      <div class="card"><span>今日登入</span><strong id="todayLogin">—</strong></div>
      <div class="card"><span>本月新增</span><strong id="monthNew">—</strong></div>
      <div class="card"><span>近 30 日活躍</span><strong id="active30">—</strong></div>
      <div class="card"><span>八字排盤次數</span><strong id="baziCasts">—</strong></div>
    </div>

    <section class="section">
      <div class="section-head"><h2>最近登入會員</h2><span id="updatedAt"></span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>名稱</th><th>Email</th><th>第一次登入</th><th>最近登入</th><th>登入次數</th></tr></thead>
          <tbody id="memberRows"></tbody>
        </table>
      </div>
    </section>
    <div class="status" id="status"></div>
  </main>
</div>

<script>
const API_BASE='https://admin-api.ezgocpu.workers.dev';
const TOKEN_KEY='divinationhub-admin-session';
const $=id=>document.getElementById(id);
const token=()=>sessionStorage.getItem(TOKEN_KEY)||'';
const setToken=v=>v?sessionStorage.setItem(TOKEN_KEY,v):sessionStorage.removeItem(TOKEN_KEY);

function fmt(t){
  if(!t)return'—';
  const d=new Date(t);
  return Number.isNaN(d.getTime())?t:d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
}
function esc(v=''){
  return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}

function showLogin(message=''){
  $('loginCard').hidden=false;
  $('dashboard').hidden=true;
  $('refreshBtn').hidden=true;
  $('logoutBtn').hidden=true;
  $('loginStatus').classList.remove('error');
  $('loginStatus').textContent=message;
  setTimeout(()=>$('passwordInput')?.focus(),0);
}

async function login(password){
  $('loginBtn').disabled=true;
  $('loginStatus').classList.remove('error');
  $('loginStatus').textContent='驗證中…';
  try{
    const r=await fetch(API_BASE+'/admin/login',{
      method:'POST',
      headers:{Accept:'application/json','Content-Type':'application/json'},
      body:JSON.stringify({password})
    });
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j?.success||!j?.token){
      throw Error(j?.error||'登入失敗');
    }
    setToken(j.token);
    $('passwordInput').value='';
    await loadStats();
  }catch(e){
    setToken('');
    $('loginStatus').textContent=e.message||String(e);
    $('loginStatus').classList.add('error');
  }finally{
    $('loginBtn').disabled=false;
  }
}

async function loadStats(){
  if(!token())return showLogin();
  $('status').textContent='讀取中…';
  $('status').classList.remove('error');
  try{
    const r=await fetch(API_BASE+'/admin/stats',{
      method:'GET',
      headers:{Authorization:'Bearer '+token(),Accept:'application/json'}
    });
    const j=await r.json().catch(()=>null);
    if(r.status===401){
      setToken('');
      showLogin('登入已過期，請重新輸入管理員密碼。');
      return;
    }
    if(!r.ok||!j?.success)throw Error(j?.error||'讀取失敗');

    const s=j.stats||{};
    $('totalMembers').textContent=s.totalMembers??0;
    $('todayLogin').textContent=s.todayLogin??0;
    $('monthNew').textContent=s.monthNew??0;
    $('active30').textContent=s.active30??0;
    $('baziCasts').textContent=s.baziCasts??0;
    $('updatedAt').textContent='更新：'+new Date().toLocaleString('zh-TW',{hour12:false});
    $('memberRows').innerHTML=(s.recentMembers||[]).map(m=>`
      <tr>
        <td>${esc(m.name||'—')}</td>
        <td>${esc(m.email||'—')}</td>
        <td class="muted">${fmt(m.created_at)}</td>
        <td class="muted">${fmt(m.last_login)}</td>
        <td>${Number(m.login_count||0)}</td>
      </tr>
    `).join('')||'<tr><td colspan="5" class="muted">目前還沒有會員資料。</td></tr>';

    $('loginCard').hidden=true;
    $('dashboard').hidden=false;
    $('refreshBtn').hidden=false;
    $('logoutBtn').hidden=false;
    $('status').textContent='';
  }catch(e){
    const msg=e.message||String(e);
    $('status').textContent=msg;
    $('status').classList.add('error');
  }
}

$('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const password=$('passwordInput').value;
  if(!password){
    $('loginStatus').textContent='請輸入管理員密碼。';
    $('loginStatus').classList.add('error');
    return;
  }
  login(password);
});
$('refreshBtn').addEventListener('click',loadStats);
$('logoutBtn').addEventListener('click',()=>{
  setToken('');
  showLogin('已登出。');
});

if(token()) loadStats(); else showLogin();
</script>
</body>
</html>
